<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — клиника «АС Дент»</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth">
    <aside class="auth__aside">
        <div>
            <a href="index.html" class="auth__brand">АС Дент</a>
            <p class="auth__lead">После регистрации вы сможете сразу записаться на приём.</p>
        </div>
        <div class="auth__contacts">
            <p>Ваши персональные данные хранятся в зашифрованном виде.</p>
        </div>
    </aside>

    <main class="auth__main">
        <form class="auth__form form" id="register-form" novalidate>
            <div>
                <h1>Регистрация</h1>
                <p class="muted">Все поля, кроме даты рождения, обязательны.</p>
            </div>

            <div class="alert alert--error" id="register-error" role="alert" hidden></div>

            <div class="field">
                <label for="full_name">ФИО</label>
                <input type="text" id="full_name" name="full_name" autocomplete="name" required maxlength="100">
                <span class="field__error" data-error-for="full_name"></span>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <span class="field__error" data-error-for="email"></span>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+7 (900) 000-00-00" required>
                    <span class="field__error" data-error-for="phone"></span>
                </div>
                <div class="field">
                    <label for="birth_date">Дата рождения</label>
                    <input type="date" id="birth_date" name="birth_date" autocomplete="bday">
                    <span class="field__error" data-error-for="birth_date"></span>
                </div>
            </div>

            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
                <span class="field__hint">Не менее 8 символов, буквы и цифры.</span>
                <span class="field__error" data-error-for="password"></span>
            </div>

            <div class="field">
                <label for="password_confirm">Повторите пароль</label>
                <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required>
                <span class="field__error" data-error-for="password_confirm"></span>
            </div>

            <label class="checkbox">
                <input type="checkbox" name="consent" required>
                <span>Я согласен на обработку персональных данных</span>
            </label>
            <span class="field__error" data-error-for="consent"></span>

            <button type="submit" class="btn btn--primary btn--block">Зарегистрироваться</button>

            <p class="auth__switch">Уже есть аккаунт? <a href="login.html" data-keep-next>Войти</a></p>
        </form>
    </main>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
