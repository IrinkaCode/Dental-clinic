<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — клиника «АС Дент»</title>
    <link rel="preload" href="fonts/golos-text-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
<div class="auth">
    <aside class="auth__aside">
        <div>
            <a href="index.html" class="auth__logo" aria-label="АС Дент — на главную">
                <img src="img/logo.svg" alt="АС Дент — авторская стоматология" width="627" height="200">
            </a>
            <p class="auth__lead">Запишитесь к стоматологу, посмотрите историю визитов и ближайшие приёмы в личном кабинете.</p>
        </div>
        <div class="auth__contacts">
            <p data-clinic="address"></p>
            <p><a data-clinic="phone"></a></p>
            <p data-clinic="working_hours"></p>
        </div>
    </aside>

    <main class="auth__main">
        <form class="auth__form form" id="login-form" novalidate>
            <div>
                <h1>Вход в кабинет</h1>
                <p class="muted">Используйте email и пароль, указанные при регистрации.</p>
            </div>

            <!-- Сюда JS выводит ошибку входа -->
            <div class="alert alert--error" id="login-error" role="alert" hidden></div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn--primary btn--block">Войти</button>

            <p class="auth__switch">Ещё нет аккаунта? <a href="register.html" data-keep-next>Зарегистрироваться</a></p>
        </form>
    </main>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cookie-notice.js"></script>
</body>
</html>
